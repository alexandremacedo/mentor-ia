services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mentor_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: mentor_api
    env_file:
      - .env
    ports:
      - "${PORT}:3000"
    depends_on:
      - postgres

volumes:
  pgdata: